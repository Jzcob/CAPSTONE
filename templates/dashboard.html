{% extends 'layout.html' %}

{% block content %}
<h1 class="text-3xl font-bold text-gray-800 mb-6">Store Overview</h1>

<div class="flex justify-between gap-4">
    <div class="w-1/3 p-4 bg-green-100 border-l-4 border-green-500 shadow-md rounded">
        <p class="text-sm text-gray-500">Daily Revenue</p>
        <p class="text-2xl font-bold">$12,450.00</p>
    </div>

    <div class="w-1/3 p-4 bg-red-100 border-l-4 border-red-500 shadow-md rounded">

    </div>

    <div class="w-1/3 p-4 bg-blue-100 border-l-4 border-blue-500 shadow-md rounded">
        <p class="text-sm text-gray-500">Clocked In</p>
        <p class="text-2xl font-bold">8 Employees</p>

</div>

<p class="text-gray-600 italic mt-4">System is currently stable. No critical errors in Audit Logs.</p>
